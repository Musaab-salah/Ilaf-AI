<svg viewBox="0 0 280 140" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E85D1F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A6FA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2E3F56;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Orange Square (top-left) -->
  <rect x="8" y="8" width="26" height="26" fill="url(#orangeGrad)" rx="2"/>
  
  <!-- Blue Top Trapezoid (top-right) -->
  <polygon points="40,8 85,8 96,26 40,26" fill="url(#blueGrad)"/>
  
  <!-- Main G Shape (Blue) - Bottom Part -->
  <g>
    <!-- Outer curve -->
    <path d="M 8 35 L 8 125 Q 8 138 20 138 L 95 138 Q 105 138 105 128 L 105 90 L 70 90 L 70 75 L 105 75 L 105 35 Q 105 25 95 25 Q 70 25 50 35 Q 35 42 25 55 Q 10 72 8 95 Z" 
          fill="url(#blueGrad)" stroke="none"/>
    
    <!-- Inner white cutout for G shape -->
    <rect x="50" y="60" width="40" height="32" fill="white" rx="2"/>
  </g>
  
  <!-- ILAF Text (Orange) -->
  <text x="120" y="38" font-family="'Arial', 'Helvetica', sans-serif" font-size="24" font-weight="900" fill="#FF6B35" letter-spacing="1.5">ILAF</text>
  
  <!-- GROUP Text (Blue) -->
  <text x="120" y="70" font-family="'Arial', 'Helvetica', sans-serif" font-size="20" font-weight="700" fill="#2E3F56" letter-spacing="1">GROUP</text>
  
  <!-- Subtitle -->
  <text x="120" y="85" font-family="'Arial', 'Helvetica', sans-serif" font-size="9" font-weight="500" fill="#999" letter-spacing="0.5">AI Solutions</text>
</svg>